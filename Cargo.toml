[package]
name = "deckd"
version = "0.1.0"
edition = "2024"
description = "A lightweight Stream Deck daemon"

[dependencies]
elgato-streamdeck = "0.12.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25"
ab_glyph = "0.2"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"
dirs = "6"
btleplug = "0.12"
libc = "0.2"
serialport = "4"
coreaudio-sys = { version = "0.2", default-features = false, features = ["audio_unit", "core_audio"] }
rusb = "0.9"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["serde"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSUUID", "NSError", "NSDictionary", "NSValue", "NSData"] }
objc2-core-bluetooth = { version = "0.3", features = ["CBCentralManager", "CBPeripheral", "CBService", "CBCharacteristic", "CBUUID", "CBManager", "CBAdvertisementData", "CBCentralManagerConstants"] }
dispatch2 = "0.3"
